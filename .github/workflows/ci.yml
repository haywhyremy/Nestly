name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Check bundle size
        run: |
          TOTAL=$(du -cb dist/assets/*.js | tail -1 | cut -f1)
          echo "Total JS size: $TOTAL bytes"
          if [ "$TOTAL" -gt 614400 ]; then
            echo "JS bundle exceeds 600KB"
            exit 1
          fi
